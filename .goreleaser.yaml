version: 2

project_name: tuitube

before:
  hooks:
    - go mod tidy

builds:
  - id: tuitube
    main: ./cmd/tuitube
    binary: tuitube
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    files:
      - catalog.db
      - README.md
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

brews:
  - name: tuitube
    repository:
      owner: gitcoder89431
      name: homebrew-tuitube
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/gitcoder89431/tuitube"
    description: "Terminal music player for curated YouTube channels with Claude MCP support"
    license: "MIT"
    dependencies:
      - name: mpv
      - name: yt-dlp
    install: |
      bin.install "tuitube"
      (share/"tuitube").install "catalog.db"
    post_install: |
      system bin/"tuitube", "bootstrap", "--catalog", share/"tuitube/catalog.db"
    test: |
      system "#{bin}/tuitube", "--version"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: desc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
